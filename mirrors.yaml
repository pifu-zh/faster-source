probe:
  connect_timeout_sec: 1
  max_time_sec: 2
  deadline_sec: 5
release:
  - etc
  - os-release
distros:
  - id: kali
    match: kali
    suite_keys: VERSION_CODENAME
    probe_path: dists/{suite}/InRelease
    marker: "Codename: {suite}"
    bases: http://http.kali.org/kali https://http.kali.org/kali
    sources: etc apt sources.list
    also: sources.list.d
    mirrors:
      - name: kali-aliyun
        baseurl: https://mirrors.aliyun.com/kali
      - name: kali-tuna
        baseurl: https://mirrors.tuna.tsinghua.edu.cn/kali
      - name: kali-ustc
        baseurl: https://mirrors.ustc.edu.cn/kali
      - name: kali-huawei
        baseurl: https://repo.huaweicloud.com/kali
      - name: kali-official
        baseurl: http://http.kali.org/kali
  - id: opensuse-tumbleweed
    match: opensuse-tumbleweed
    suite: rolling
    probe_path: tumbleweed/repo/oss/repodata/repomd.xml
    marker: repomd
    bases: https://download.opensuse.org/tumbleweed http://download.opensuse.org/tumbleweed
    sources: etc zypp repos.d
    mirrors:
      - name: tumbleweed-aliyun
        baseurl: https://mirrors.aliyun.com/opensuse/tumbleweed
      - name: tumbleweed-tuna
        baseurl: https://mirrors.tuna.tsinghua.edu.cn/opensuse/tumbleweed
      - name: tumbleweed-ustc
        baseurl: https://mirrors.ustc.edu.cn/opensuse/tumbleweed
      - name: tumbleweed-official
        baseurl: https://download.opensuse.org/tumbleweed
  - id: opensuse-leap
    match: opensuse-leap opensuse
    suite_keys: VERSION_ID
    probe_path: distribution/leap/{suite}/repo/oss/repodata/repomd.xml
    marker: repomd
    bases: https://download.opensuse.org/distribution/leap http://download.opensuse.org/distribution/leap
    sources: etc zypp repos.d
    mirrors:
      - name: leap-aliyun
        baseurl: https://mirrors.aliyun.com/opensuse
      - name: leap-tuna
