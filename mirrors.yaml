      - name: leap-huawei
        baseurl: https://repo.huaweicloud.com/opensuse
      - name: leap-tencent
        baseurl: https://mirrors.cloud.tencent.com/opensuse
      - name: leap-official
        baseurl: https://download.opensuse.org
  - id: rocky
    match: rocky
    suite_keys: VERSION_ID
    probe_path: "{suite}/BaseOS/source/tree/repodata/repomd.xml"
    marker: repomd
    bases: https://download.rockylinux.org/pub/rocky http://download.rockylinux.org/pub/rocky
    sources: etc yum.repos.d
    mirrors:
      - name: rocky-aliyun
        baseurl: https://mirrors.aliyun.com/rockylinux
      - name: rocky-tuna
        baseurl: https://mirrors.tuna.tsinghua.edu.cn/rockylinux
      - name: rocky-ustc
