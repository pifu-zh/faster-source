    suite_keys: VERSION_ID
    probe_path: "{suite}/BaseOS/source/tree/repodata/repomd.xml"
    marker: repomd
    bases: https://repo.almalinux.org/almalinux http://repo.almalinux.org/almalinux
    sources: etc yum.repos.d
    mirrors:
