        baseurl: https://repo.almalinux.org/almalinux
  - id: fedora
    match: fedora
    suite_keys: VERSION_ID
    probe_path: releases/{suite}/Everything/source/tree/repodata/repomd.xml
    marker: repomd
    bases: https://download.fedoraproject.org/pub/fedora/linux http://download.fedoraproject.org/pub/fedora/linux
